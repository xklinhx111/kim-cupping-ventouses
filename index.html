<script>
/* Trait animé sous le menu + survol des tuiles — sans bibliothèque. */
(function () {
  "use strict";
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var nav = document.querySelector(".header nav");
  if (!nav) return;
  var liens = nav.querySelectorAll("a");
  if (!liens.length) return;

  var ligne = document.createElement("span");
  ligne.className = "nav-ligne";
  nav.appendChild(ligne);

  function place(el) {
    if (!el) { ligne.style.opacity = "0"; return; }
    ligne.style.transition = "left .34s cubic-bezier(.2,.7,.3,1), width .34s cubic-bezier(.2,.7,.3,1), opacity .2s";
    ligne.style.left = el.offsetLeft + "px";
    ligne.style.width = el.offsetWidth + "px";
    ligne.style.top = (el.offsetTop + el.offsetHeight + 10) + "px";
    ligne.style.opacity = "1";
  }

  liens.forEach(function (a) {
    a.addEventListener("mouseenter", function () { place(a); });
    a.addEventListener("focus", function () { place(a); });
  });
  nav.addEventListener("mouseleave", function () { place(null); });
  window.addEventListener("resize", function () { ligne.style.width = "0px"; });
})();
</script>

  vague(".faq-list details, .before-booking p, .visit-details, .visit-reasons li", { y: 30, ecart: 0.06 });
  vague(".booking h2, .booking .eyebrow, .booking .button, .sessions-bottom, .footer-top", { y: 34, ecart: 0.09 });

  /* Bandeau réassurance : entrée latérale */
  var reassurance = document.querySelector(".reassurance");
  if (reassurance) {
    gsap.from(reassurance, { autoAlpha: 0, x: -40, duration: 0.9, ease: "power2.out",
      scrollTrigger: { trigger: reassurance, start: "top 92%", once: true } });
  }

  /* Titre géant de la réservation : respiration au scroll */
  var titreBooking = document.querySelector(".booking h2");
  if (titreBooking) {
    gsap.from(titreBooking, { scale: 0.92, ease: "none",
      scrollTrigger: { trigger: ".booking", start: "top bottom", end: "top 40%", scrub: 1 } });
  }

  /* Tuiles : inclinaison 3D suivant le pointeur */
  document.querySelectorAll(".service").forEach(function (tuile) {
    tuile.addEventListener("mousemove", function (e) {
      var r = tuile.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      gsap.to(tuile, { rotateY: px * 9, rotateX: -py * 8, y: -16, scale: 1.03,
        transformPerspective: 900, duration: 0.5, ease: "power2.out" });
    });
    tuile.addEventListener("mouseenter", function () { tuile.classList.add("survol"); });
    tuile.addEventListener("mouseleave", function () {
      tuile.classList.remove("survol");
      gsap.to(tuile, { rotateX: 0, rotateY: 0, y: 0, scale: 1,
        duration: 0.7, ease: "elastic.out(1, 0.55)" });
    });
  });

  /* Sculpture générative de la section réservation */
  var zone = document.querySelector(".booking");
  if (zone) {
    var styleS = document.createElement("style");
    styleS.textContent = ".booking{position:relative;overflow:hidden}" +
      ".booking>.sculpture{position:absolute;inset:0;z-index:0;pointer-events:none}" +
      ".booking>*:not(.sculpture){position:relative;z-index:1}";
    document.head.appendChild(styleS);
    var support = document.createElement("div");
    support.className = "sculpture";
    var canvas = document.createElement("canvas");
    support.appendChild(canvas);
    zone.insertBefore(support, zone.firstChild);
    var ctx = canvas.getContext("2d");
    function dimensionner() {
      canvas.width = Math.max(1, Math.floor(zone.offsetWidth / 2));
      canvas.height = Math.max(1, Math.floor(zone.offsetHeight / 2));
      canvas.style.width = "100%"; canvas.style.height = "100%";
    }
    dimensionner();
    window.addEventListener("resize", dimensionner);
    var teintes = ["#426354", "#44634b", "#63806b", "#8aa58f", "#d7e1c8"];
    var ondes = [];
    for (var i = 0; i < 5; i++) {
      ondes.push({ t: Math.random() * 6.28, v: 0.0018 + Math.random() * 0.0022,
        a: 0.05 + Math.random() * 0.045, r: 0.26 + i * 0.075,
        d: 0.10 + Math.random() * 0.08, c: teintes[i % teintes.length] });
    }
    var actif = false;
    function dessine() {
      if (!actif) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < ondes.length; i++) {
        var o = ondes[i];
        o.t += o.v;
        var cx = canvas.width * (0.5 + Math.cos(o.t * 0.9 + i) * o.d);
        var cy = canvas.height * (0.5 + Math.sin(o.t * 0.7 + i * 1.7) * o.d);
        var ray = Math.min(canvas.width, canvas.height) * (o.r + Math.sin(o.t * 1.3 + i) * 0.03);
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, ray));
        g.addColorStop(0, o.c + Math.round(o.a * 255).toString(16).padStart(2, "0"));
        g.addColorStop(1, o.c + "00");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(1, ray), 0, 6.283);
        ctx.fill();
      }
      requestAnimationFrame(dessine);
    }
    new IntersectionObserver(function (e) {
      var v = e[0].isIntersecting;
      if (v && !actif) { actif = true; support.classList.add("ready"); requestAnimationFrame(dessine); }
      else if (!v) { actif = false; }
    }, { threshold: 0.05 }).observe(zone);
  }
})();
</script>


<script>
/* FAQ : ouverture et fermeture en hauteur animée, une seule ouverte à la fois. */
(function () {
  "use strict";
  var doux = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var items = document.querySelectorAll(".faq-list details");
  if (!items.length) return;

  items.forEach(function (d) {
    var corps = d.querySelector("p, .body, div");
    var resume = d.querySelector("summary");
    if (!corps || !resume) return;

    if (!doux) corps.style.overflow = "hidden";

    resume.addEventListener("click", function (e) {
      if (doux) return;
      e.preventDefault();

      if (d.open) {
        var h0 = corps.scrollHeight;
        corps.animate([{ height: h0 + "px", opacity: 1 }, { height: "0px", opacity: 0 }],
          { duration: 220, easing: "cubic-bezier(.3,0,.6,1)" })
          .onfinish = function () { d.open = false; corps.style.height = ""; };
      } else {
        items.forEach(function (autre) { if (autre !== d) autre.open = false; });
        d.open = true;
        var h1 = corps.scrollHeight;
        corps.animate([{ height: "0px", opacity: 0 }, { height: h1 + "px", opacity: 1 }],
          { duration: 300, easing: "cubic-bezier(.2,.7,.3,1)" })
          .onfinish = function () { corps.style.height = ""; };
      }
    });
  });
})();
</script>
<script>
/* Fenêtres d'information du pied de page. Le bouton Confidentialité
   existait sans aucun code pour l'ouvrir. */
(function () {
  "use strict";
  [["privacy-open", "privacy-dialog", "privacy-close"],
   ["legal-open", "legal-dialog", "legal-close"]].forEach(function (t) {
    var ouvre = document.getElementById(t[0]),
        boite = document.getElementById(t[1]),
        ferme = document.getElementById(t[2]);
    if (!ouvre || !boite || typeof boite.showModal !== "function") return;
    ouvre.addEventListener("click", function () { boite.showModal(); });
    if (ferme) ferme.addEventListener("click", function () { boite.close(); });
    boite.addEventListener("click", function (e) { if (e.target === boite) boite.close(); });
  });
})();
</script>
